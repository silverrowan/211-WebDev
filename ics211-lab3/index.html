<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ICS 211 Lab 2 Task 3 by Mariah Malczewska</title>
  <script type="importmap">
    {
      "imports": {
        "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime/?dev",
        "react-dom/client": "https://esm.sh/react-dom@19/client/?dev"
      }
    }
  </script>
  <script type="module" src="https://esm.sh/tsx"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        import { createRoot } from 'react-dom/client';   
        
        const Header = () => (
            <>
                <h1>Favorite Teas</h1>
                <h3>by Mariah Malczewska</h3>  
            </>
        )

        const FavoriteItem = ({key, itemName, itemLink}) => (
            <li>{itemName}:  <a href={itemLink}>{itemLink}</a></li>
        )

        const FavoriteItemList = () => {
          const teaArray = [
              { id:0, itemName: "Ice Wine Black Tea", itemLink: "https://www.stevesteas.com/products/icewine?srsltid=AU7gw4WR41a3iKpNEnTy3BjOd4OMCO-OVqVY8LVDSPES4VFlUiqfxMWt" },
              { id:1, itemName: "Rose Congou Tea", itemLink: "https://pippinstea.com/products/china-rose-congou-loose-leaf-tea?_pos=5&_sid=1051e1a8e&_ss=r" },
              { id:2, itemName: "Masala Chai Black Tea", itemLink: "https://pippinstea.com/products/masala-chai-loose-leaf-tea" }
          ];   

          return <ol>
                    {teaArray.map( tea => 
                        <FavoriteItem key={tea.id} itemName={tea.itemName} itemLink={tea.itemLink} />
                    )}
                </ol>
        }

        const App = () => (
          <>
            <Header />
            <FavoriteItemList />          
          </>
        )

        // change null to your parent React element
        createRoot(document.getElementById('root')).render(
            <>
              <App />
            </>
        );
    </script>
</body>
</html>
