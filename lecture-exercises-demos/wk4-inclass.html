<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>React/JSX Template</title>
    <script type="importmap">
      {
        "imports": {
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime/?dev",
          "react-dom/client": "https://esm.sh/react-dom@19/client/?dev"
        }
      }
    </script>
    <script type="module" src="https://esm.sh/tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      import { createRoot } from 'react-dom/client';

      const App = () => {
        const courses = [
          { id: 0, code: 211, title: 'Web Apps' },
          { id: 1, code: 212, title: 'Database' },
          { id: 2, code: 228, title: 'Ethics' }
        ];

        return courses.map( ( props ) =>
        <Course key={props.id} id={props.id} code={props.code} title={props.title} />
      )

      }

      const Course = ({ id, code, title }) => (
        <p id={id}>{code} {title}</p>
      )

      // change null to your parent React element
      createRoot(document.getElementById('root')).render( <App /> );
    </script>
  </body>
</html>
