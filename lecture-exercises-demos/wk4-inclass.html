<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>React/JSX Template</title>
    <script type="importmap">
      {
        "imports": {
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime/?dev",
          "react-dom/client": "https://esm.sh/react-dom@19/client/?dev"
        }
      }
    </script>
    <script type="module" src="https://esm.sh/tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
    import { createRoot } from 'react-dom/client';
    // import the Styled Components library from the CDN
    import styled from 'https://esm.sh/styled-components@6/?dev';

    const StyledHeading = styled.h1`
      font-size: 30pt;
      color: navy;
    `;

    const Header = () => (
      <StyledHeading>
        ICS 211 Web Apps
      </StyledHeading>
    );
    
    const StyledPar = styled.p`
      color: ${props => props.color};
    `;

    // Object destructured props also works.
    // but doesn't save you typing
    // const StyledP = styled.p`
    //   color: ${ ({ color }) => color};
    // `;

    // Original Lab Component
    // const Lab = ({ id, topic }) => (
    //   <p id={id}>
    //     You did a lab on {topic} this semester.
    //   </p>
    // );

    const Lab = ({ id, topic, color }) => (
      <StyledPar color={color} id={id}>
        You did a lab on {topic} this semester.
      </StyledPar>
    );

    const App = ({ className }) => {
      const labs = [
        { id: 0, topic: 'Connecting to Your VM in VSC and JS Review Quiz', color: 'blue' },
        { id: 1, topic: 'SOP, AJAX, XSS, and SQLi', color: 'green' },
        { id: 2, topic: 'Creating a Static HTML Page by Manipulating the DOM', color: 'red' }
      ];
      
      return (
        <div className={className}>
          <Header />
          {labs.map(lab =>
            <Lab key={lab.id} id={lab.id} topic={lab.topic} color={lab.color} />
          )}
        </div>
      );
    }

    const StyledApp = styled(App)`
      border: 5px solid;
      padding: 10px;
    `;


    // change null to your parent React element
    createRoot(document.getElementById('root')).render(
      <StyledApp />
    );
    </script>
  </body>
</html>
