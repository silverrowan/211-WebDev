<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>React/JSX Template</title>
    <script type="importmap">
      {
        "imports": {
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime/?dev",
          "react-dom/client": "https://esm.sh/react-dom@19/client/?dev"
        }
      }
    </script>
    <script type="module" src="https://esm.sh/tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      // import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';
    
      const ForumPost = ( { id, title, author, content} ) => (
        <div id='{id}'>
          <h2>{title}</h2>
          <h4>{author}</h4>
          <p>{content}</p>
        </div>
      )

      const posts = [
        {id:"3", title: "Post 3", author: "Bob", content: "This post is stored in the array" },
        {id:"4", title: "Post 4", author: "Alice", content: "This post is also stored in the array" },
      ]
      // change null to your parent React element
      createRoot(document.getElementById('root')).render( 
        <>
        { posts.map( post => 
          <ForumPost key={post.id} id={post.id} title={post.title} author={post.author} content={post.content} /> 
        )}
        </>
      );
    </script>
  </body>
</html>
