  <script type="importmap">

      }

  </script>
  <script type="module" src="https://esm.sh/tsx"></script>

<body>
    <div id="root"></div>
    <script type="text/babel">
      import styled from 'https://esm.sh/styled-components@6/?dev';
      import { createRoot } from 'react-dom/client';
      import { useState } from 'https://esm.sh/react@19/?dev'; 

        // ------Title------
        const Header = () => (
            <>
                <StyledTitle>Favorite Teas</StyledTitle>
                <h3>by Mariah Malczewska</h3>  
            </>
        )

        // ------Form------
        // use components: form, fieldset, legend, input
        const FavoriteItemForm = ({ title, link }) => {
          const [ value, setValue ] = useState( '' );

          const updateField = event => {
            setValue( event.target.value )
          }
          
          //wrapper for submitting 
            const addTea = event => {
              event.preventDefault();
              console.log(`textfield was: ${value}.`);
              setValue('')
            }

          // const updateField = (newValue) => {
          //     const newValueObj = {
          //         id: values.length,
          //         text: newValue
          //     }
          //     setValues( values.concat(newValueObj) );
          //   }

          // <form onSubmit={addTea}>
          return (
            // <>
            //   <form onSubmit={addTea}>
            //     <fieldset style={{ display: 'flex', flexDirection: "column", gap: '2em'}}>
            //       <StyledLegend style={{ marginBottom: '0.75em'}}>Add a Tea:</StyledLegend>
            //         < FormLabeledInput id="addTeaName" label="Tea" type="" width='60%'/>
            //         < FormLabeledInput id="addTeaLink" label="Link" type="url" width='' />
            //       <div style={{ display:'flex', justifyContent:'center'}}>
            //         <StyledButton type="submit">Add Tea</StyledButton>
            //       </div>
            //     </fieldset>
            //   </form>
            // </>
            <>
              <form onSubmit={addTea}>
                <fieldset style={{ display: 'flex', flexDirection: "column", gap: '2em'}}>
                  <StyledLegend style={{ marginBottom: '0.75em'}}>Add a Tea:</StyledLegend>

                    <div style={{ display: 'flex', flexDirection: "row", gap: "0.25em", width: '60%' }}>
                      <StyledLabel htmlFor="addTeaName">Tea:</StyledLabel> {/* note, no id for label... "[var]str" but w curlies wasn't working */}
                      <input name="TeaIn" id="addTeaName" value={value} onChange={updateField} style={{flex: 1}} />                
                    </div>
                    <div style={{ display: 'flex', flexDirection: "row", gap: "0.25em"}}>
                      <StyledLabel htmlFor="addTeaLink">Link:</StyledLabel> {/* note, no id for label... "[var]str" but w curlies wasn't working */}
                      <input type="url" name="LinkIn" id="addTeaLink" value={value} onChange={updateField} style={{flex: 1}} />                
                    </div>

                    <div style={{ display:'flex', justifyContent:'center'}}>
                    <StyledButton type="submit">Add Tea</StyledButton>
                  </div>
                </fieldset>
              </form>
            </>            
          );
        };

        const FormLabeledInput = ({ id, label, width }) => {
          const [ value, setValue ] = useState( '' );

          const updateField = event => {
            setValue( event.target.value )
          }

          // const setValue = ('value') => ( value=value + new );

          // const updateField = ({ value, setValue }) => {}

          return (
            <div style={{ display: 'flex', flexDirection: "row", gap: "0.25em", width }}>
              <StyledLabel htmlFor={id}>{label}:</StyledLabel> {/* note, no id for label... "[var]str" but w curlies wasn't working */}
              <input name={label} id={id} value={value} onChange={updateField} style={{flex: 1}} />                
            </div>
          );
        };    

        // ------List Items------
        const FavoriteItem = ({id, itemName, itemLink, color}) => (
            <StyledListItem key={id} color={color}><b>{itemName}:</b>  <a href={itemLink}>{itemLink}</a></StyledListItem>
        )

        const FavoriteItemList = () => {
          const teaArray = [
              { id:0, itemName: "Ice Wine Black Tea", itemLink: "https://www.stevesteas.com/products/icewine", color: 'blue'},
              { id:1, itemName: "Rose Congou Tea", itemLink: "https://pippinstea.com/products/china-rose-congou-loose-leaf-tea", color: 'green' },
              { id:2, itemName: "Masala Chai Black Tea", itemLink: "https://pippinstea.com/products/masala-chai-loose-leaf-tea", color: '#8f71e3' }
          ];   

          return <ol style={{ listStyle: 'none', margin: 0, padding: 0 }}>
                    {teaArray.map( tea => 
                        <FavoriteItem key={tea.id} itemName={tea.itemName} itemLink={tea.itemLink} color={tea.color}/>
                    )}
                </ol>
        }

        // ------Entire Application------
        const App = ({className}) => (
          <div className={className}>
            <Header />
            <FavoriteItemForm />
            <FavoriteItemList />          
          </div>
        )

        // ------STYLING------
        const StyledApp = styled(App)`
          width: 650px;
          background-color: #a3d4ff;
          border: 3px solid;
          padding: 25px;
          padding-top: 0px;
          margin-top: 25px;
          margin-left: 25px;
          `;

        const StyledTitle = styled.h1`
            color: navy;
            font-size: 30pt;
            margin-bottom: -15px;
        `
        const StyledLegend = styled.legend`
            color: navy;
            font-weight: 900;
            padding: 0.5em; 
        `
        const StyledLabel = styled.label`
            font-weight: 900;
            margin: 0.1em; 
        `
        const StyledButton = styled.button`
            color: white;
            padding: 0.8em;
            font-size: 10pt;
            border: 1px solid rgba(0,0,0, 0.1);
            border-radius: 0.2em;
            background: #58a linear-gradient(hsla(0, 0%, 100%, 0.2), transparent);
            box-shadow: 0 0.05em 0.25em rgba(0,0,0, 0.5);
        `
        const StyledListItem = styled.li`
            background-color: #ffffff88;
            margin: 10px 2px;
            padding: 5px;
            border-radius:5px;
            font-family: sans-serif;
            list-style: none;
            color: ${props=>props.color};
        `;

        // change null to your parent React element
        createRoot(document.getElementById('root')).render( <StyledApp /> );
    </script>
</body>
</html>
