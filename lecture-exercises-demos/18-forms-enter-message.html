<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>React/JSX Template</title>
    <script type="importmap">
      {
        "imports": {
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime/?dev",
          "react-dom/client": "https://esm.sh/react-dom@19/client/?dev"
        }
      }
    </script>
    <script type="module" src="https://esm.sh/tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      import { createRoot } from 'react-dom/client';
      import { useState } from 'https://esm.sh/react@19/?dev';

      const EnterMessageDemo = () => {
        // way to much going on here
        // too many responsibilities

        //state hook
        const [ message, setMessage ] = useState('');

        // event handler convention -- handle____
        const addNewMessage = event => {
          event.preventDefault();
          // console.log(`the message entered was: ${message}.`);
          setMessages(messages.concat(message))
          setMessage('');
        }

        const handleText = event => (
          setMessage( event.target.value )
      )

        // rendering logic
        return (
          <form onSubmit={ addNewMessage }>
            <fieldset>
              <legend>Enter a Message: </legend>
              <input type="text" name="message" value={message} onChange={handleText} />
              <button type="submit">Add Message</button>
            </fieldset>
          </form>
        );
      }

      const MessageList = ({ messages}) => (
        <ul>
          {message.map( message =>
            <Message key={message.id} messageText={message.text} />
          )}
        </ ul>
      )
      
      const App = () => {
        const [ messages, setMessages ] = useState([]);
        
        // wrapper around call to set?
        const addMessage = newMessageText => {
          const newMessageObject = {
            id: messages.length,
            text: newMessageText
          }

          setMessages( messages.concat(newMessageObject) );
        }

        return (
          <>
            <EnterMessageForm addMessage={addMessage} /> {/* // inverse data flow up tree */}
            <messgeList messages={messages} />
          </>
        )
      }
    
      // change null to your parent React element
      createRoot(document.getElementById('root')).render(<EnterMessageDemo/>);
    </script>
  </body>
</html>
