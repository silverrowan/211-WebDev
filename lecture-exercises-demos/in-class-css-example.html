<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ICS211 Using map to Render Component</title>
    <script type="importmap">
      {
        "imports": {
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime/?dev",
          "react-dom/client": "https://esm.sh/react-dom@19/client/?dev"
        }
      }
    </script>
    <script type="module" src="https://esm.sh/tsx"></script>
    <link rel="stylesheet" href="ICS211.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      import { createRoot } from 'react-dom/client';
      import styled from 'https://esm.sh/styled-components@6/?dev';

      const StyledHeading = styled.h1`
            font-size:20pt;
            color: lavender;
            `;
            //now this REPLACES the h1 entirely
      
      //applying both the external (name=heading) & inline method (fontSize)
    //   const Header = () => (
    //     <h1 className="heading" style={{fontSize:'40pt', color: 'green'}}>
    //         ICS 211 Web Apps
    //     </h1>
    //     )
    const Header = () => (
        <StyledHeading className="heading">
            ICS 211 Web Apps
        </StyledHeading>
        )

      const Lab = ({ id, topic }) => (
        <p id={id}>
          You did a lab on {topic} this semester.
        </p>
      );
        
      const App = () => {
        const labs = [
          { id: 0, topic: 'Connecting to Your VM in Visual Studio Code' },
          { id: 1, topic: 'SOP, AJAX, XSS, and SQLi' },
          { id: 2, topic: 'Creating a Static HTML Page by Manipulating the DOM' }
        ];

        return (
          <>
            <Header />
            {labs.map( lab =>
              <Lab key={lab.id} id={lab.id} topic={lab.topic} />
            )}
          </>
        ); 
      }

      createRoot(
        document.getElementById('root')).render(
          <App />
        );
    </script>
  </body>
</html>
