<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Enter Message Demo ICS211</title>
    <script type="importmap">
      {
        "imports": {
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime/?dev",
          "react-dom/client": "https://esm.sh/react-dom@19/client/?dev"
        }
      }
    </script>
    <script type="module" src="https://esm.sh/tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      import { createRoot } from 'react-dom/client';
      import { useRef, useState } from 'https://esm.sh/react@19/?dev';

      const MessageForm = ({ addMessage }) => {
        const [ message, setMessage ] = useState('');       

        const addNewMessage = event => {
          event.preventDefault();
          //console.log(`The message entered was: ${message}.`);
          addMessage(message);
          setMessage('');
        }

        return (
          <form onSubmit={addNewMessage}>
            <fieldset>
              <legend>Enter a Message: </legend>
              <input type="text" name="message" value={message}
                onChange={ event => setMessage( event.target.value ) }
              />
              <button type="submit" disabled={!message}>Add Message</button>
            </fieldset>
          </form>
        );
      }

      const DisplayMessages = ({ messages, searchMessage, editMessage, deleteMessage }) => {
        
        const messagesToShow = searchMessage
          ? messages.filter( message => 
            message.text.toLowerCase().includes(searchMessage) )
          : messages
        
        return (
          <ul>
            { messagesToShow.map( message =>
                <Message 
                  key={message.id}
                  id={message.id}
                  messageText={message.text} 
                  editMessage={editMessage}
                  deleteMessage={deleteMessage}
                />
            )}
          </ul>
        );
      };

      const Message = ({ id, messageText, editMessage, deleteMessage }) => {
        const [ isEditable, setIsEditable ] = useState(false);

        const modifyMessage = modifiedText => {
          //event handler, eventually pass onto editmessage form
          //wrapper function, to keep call to set inside same component that has state hook
          editMessage( id, modifiedText );
          setIsEditable(false);
        }

        return (
          //when double click calls this function and causes re-render
          <li onDoubleClick={ () => setIsEditable(true) }>
            { isEditable 
                ? <EditMessageForm 
                    messageText={messageText}
                    modifyMessage={modifyMessage}
                  />
                : messageText
            }
            <button onClick={ () => deleteMessage(id) }>delete</button>
          </li>
        )
      };

      const EditMessageForm = ({ messageText, modifyMessage }) => {
        const [ modifiedText, setModifiedText] = useState(messageText);

        const handleFormSubmit = event => {
          event.preventDefault(); //do not do for ANYTHING other than form submission, but ALWAYS do for form submit
          modifyMessage(modifiedText);
        }

        return (
          <form onSubmit={handleFormSubmit}>
          <input
            value={modifiedText}
            onChange={event => setModifiedText(event.target.value)}
          />
          </form>
        );
      }

      const FilterMessage = ({searchMessage, handleSearchMessageChange}) => (
        <div style={{ margin: '15px'}}>Show only messages containing:&nbsp;
          <input value={searchMessage} onChange={handleSearchMessageChange} />
        </div>
      );

      const App = () => {
        const [ messages, setMessages ] = useState([]);

        const [searchMessage, setSearchMessage] = useState('');

        const id = useRef(0); // initialize the ref to 0

        const addMessage = newMessageText => {
          if (messages.some( message =>
            message.text.toLowerCase() === newMessageText.toLowerCase() )) {
            alert(`${newMessageText.toLowerCase()} message is already in list of messages!`);
          } else {
            // create object and add to list of messages
            const newMessageObject = {
              id: id.current,
              text: newMessageText
            }
            setMessages(messages.concat(newMessageObject));
            id.current += 1
          }
        }

        const editMessage = (modifiedMessageId, modifiedMessageText) => {
          // build new array with modified object and assign to State Hook
          const newMessages = messages.map( message =>
            message.id === modifiedMessageId
              ? { ...message, text: modifiedMessageText }
              : message
            );
          setMessages(newMessages);
        }

        const deleteMessage = messageId => {
          setMessages(messages.filter( message => message.id !== messageId ));
        }

        return (
          <>
            <MessageForm addMessage={addMessage} />
            <FilterMessage
              searchMessage={searchMessage}
              handleSearchMessageChange=
                {event => setSearchMessage(event.target.value)}
            />
            <DisplayMessages
              messages={messages}
              searchMessage={searchMessage}
              editMessage={editMessage}
              deleteMessage={deleteMessage}
            />
          </>
        );
      }
    
      // change null to your parent React element
      createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
